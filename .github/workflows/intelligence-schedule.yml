name: Wake LeadFlow intelligence cycle
on:
  schedule:
    # UTC and Eastern both run at :30. GitHub schedules remain best effort.
    - cron: '30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intelligence-schedule.yml'
      - 'scripts/wake-intelligence.mjs'
      - 'tests/intelligence-wake.test.mjs'
permissions:
  contents: read
concurrency:
  group: leadflow-intelligence-cycle
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify wake evidence rules
        run: node --test tests/intelligence-wake.test.mjs
      - name: Execute authenticated intelligence cycle
        env:
          LEADFLOW_AUTOMATION_TOKEN: ${{ secrets.LEADFLOW_AUTOMATION_TOKEN }}
        run: node scripts/wake-intelligence.mjs
      - name: Record verified outcome
        run: cat schedule-wake-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-wake-evidence
          path: schedule-wake-evidence.json
          if-no-files-found: error
          retention-days: 14
