name: Wake LeadFlow intelligence cycle
on:
  schedule:
    # Run hourly at minute 30 UTC; :30 is also :30 Eastern across EST/EDT.
    # First intended run after this change: 2026-11-05 02:30 UTC (Nov 4, 9:30 PM EST).
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leadflow-intelligence-cycle
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LEADFLOW_AUTOMATION_TOKEN: ${{ secrets.LEADFLOW_AUTOMATION_TOKEN }}
    steps:
      - name: Require private automation token
        if: env.LEADFLOW_AUTOMATION_TOKEN == ''
        run: |
          echo '::error::Manual setup required: add LEADFLOW_AUTOMATION_TOKEN as a GitHub Actions repository secret.'
          exit 1
      - name: Trigger bounded intelligence cycle
        if: env.LEADFLOW_AUTOMATION_TOKEN != ''
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 100 \
            --request POST 'https://leadflow-research-api.onrender.com/automation' \
            --header 'Content-Type: application/json' \
            --header "X-LeadFlow-Token: ${LEADFLOW_AUTOMATION_TOKEN}" \
            --data '{"action":"run","trigger":"${{ github.event_name }}","workflowRunId":"${{ github.run_id }}"}')
          printf '%s' "$response" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r.get("enabled") is True and not r.get("error"), "Intelligence cycle disabled or failed: " + str({k:v for k,v in r.items() if k not in ("token","secret")}); print("Intelligence cycle accepted:", {k:r.get(k) for k in ("lastRun","created","prospectsDiscovered","websitesResearched","growthLensAudits","skipped")})'
      - name: Record authenticated wake evidence
        if: success()
        shell: bash
        run: |
          printf 'event=%s run_id=%s commit=%s workflow=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_WORKFLOW" | tee schedule-wake-evidence.txt
          cat schedule-wake-evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: schedule-wake-evidence
          path: schedule-wake-evidence.txt
          retention-days: 14
