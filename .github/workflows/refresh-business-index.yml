name: Refresh Maryland business index
on:
  push:
    paths:
      - 'scripts/build_maryland_index.py'
      - 'backend/data/maryland-seed-businesses.json'
      - '.github/workflows/refresh-business-index.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 0'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium
      - name: Diagnose importer environment
        run: |
          python -c 'import osmium; print("pyosmium import OK")'
          df -h .
          curl -IL --max-time 25 https://download.geofabrik.de/north-america/us/maryland-latest.osm.pbf
      - run: curl -fL --retry 3 --max-time 600 https://download.geofabrik.de/north-america/us/maryland-latest.osm.pbf -o /tmp/maryland.osm.pbf
      - run: python scripts/build_maryland_index.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          p='backend/data/maryland-businesses.json'
          data=json.load(open(p))
          records=data.get('records',[])
          print('MARYLAND_INDEX_RECORDS='+str(len(records)))
          print('FINANCIAL_ADVISORS='+str(sum('Financial advisors' in r.get('niches',[]) for r in records)))
          print('BEL_AIR_POSTCODE_21015='+str(sum(r.get('tags',{}).get('addr:postcode')=='21015' for r in records)))
          assert records, 'Snapshot must contain sourced business records'
          PY
      - name: Upload index artifact even if repository push fails
        uses: actions/upload-artifact@v4
        with:
          name: maryland-business-index
          path: backend/data/maryland-businesses.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit real source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/maryland-businesses.json
          git diff --cached --quiet || (git commit -m "Refresh Maryland OpenStreetMap business index" && git push)
