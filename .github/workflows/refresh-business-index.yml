name: Refresh Maryland business index
on:
  # Refresh once when the importer changes on main, not on every app push.
  # Normal updates remain on the free weekly schedule or manual dispatch.
  push:
    branches: [main]
    paths:
      - scripts/build_maryland_index.py
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 0'
concurrency:
  group: maryland-attributed-index
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium
      - name: Verify real parser with isolated named-pizza and Maryland snapshot fixtures
        run: python scripts/test_regional_import.py
      - name: Diagnose importer environment
        run: |
          python -c 'import osmium; print("pyosmium import OK")'
          df -h .
          curl -IL --max-time 25 https://download.geofabrik.de/north-america/us/maryland-latest.osm.pbf
      - run: curl -fL --retry 3 --max-time 600 https://download.geofabrik.de/north-america/us/maryland-latest.osm.pbf -o /tmp/maryland.osm.pbf
      - run: python scripts/build_maryland_index.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          p='backend/data/maryland-businesses.json'
          data=json.load(open(p))
          records=data.get('records',[])
          print('MARYLAND_INDEX_RECORDS='+str(len(records)))
          print('FINANCIAL_ADVISORS='+str(sum('Financial advisors' in r.get('niches',[]) for r in records)))
          print('BEL_AIR_POSTCODE_21015='+str(sum(r.get('tags',{}).get('addr:postcode')=='21015' for r in records)))
          assert len(records)>=10, 'Snapshot must preserve the ten source-attributed seed businesses'
          niches={n for r in records for n in r.get('niches',[])}
          print('NICHE_COVERAGE='+str(sorted(niches)))
          seed=json.load(open('backend/data/maryland-seed-businesses.json')).get('records',[])
          identities=lambda items: {(str(r.get('tags',{}).get('name','')).casefold(),str(r.get('tags',{}).get('addr:postcode',''))) for r in items}
          missing=identities(seed)-identities(records)
          assert not missing, 'Seed business identities lost: '+repr(sorted(missing)[:5])
          assert 'Financial advisors' in niches, 'Financial advisor seed records missing'
          assert len(niches)>=3, 'Statewide import must contain at least three distinct business niches'
          assert len(records)>10, 'Statewide import must add new sourced businesses before publishing'
          import gzip
          regional=json.loads(gzip.decompress(open('backend/data/us-regional/maryland.json.gz','rb').read()))
          assert regional==data, 'Plain and compressed Maryland indexes must come from one actual source extraction'
          pizza=[r for r in records if 'Pizza restaurants' in r.get('niches',[])]
          assert pizza, 'No named restaurant or cuisine-backed pizza listings in refreshed public source'
          assert all(r.get('tags',{}).get('amenity') in ('restaurant','fast_food') and
                     ('pizza' in r.get('tags',{}).get('cuisine','').lower() or
                      'pizza' in r.get('tags',{}).get('name','').lower()) for r in pizza)
          print('PIZZA_RESTAURANTS='+str(len(pizza)))
          PY
      - name: Upload index artifact even if repository push fails
        uses: actions/upload-artifact@v4
        with:
          name: maryland-business-index
          path: |
            backend/data/maryland-businesses.json
            backend/data/us-regional/maryland.json.gz
          if-no-files-found: error
          retention-days: 7
      - name: Commit real source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/maryland-businesses.json backend/data/us-regional/maryland.json.gz
          git diff --cached --quiet || (git commit -m "Refresh Maryland OpenStreetMap business index" && git push)
