name: LeadFlow tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kb_test
          POSTGRES_PASSWORD: kb_test_password
          POSTGRES_DB: kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb_test -d kb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install open-source document parsers
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install PDF fixture generator
        run: python3 -m pip install --quiet reportlab
      - name: Build small real PDF and DOCX extraction fixtures
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out=Path('/tmp')
          from reportlab.pdfgen import canvas
          pdf=canvas.Canvas('/tmp/kb-sample.pdf')
          pdf.drawString(72,720,'Sample PDF service offering')
          pdf.save()
          with zipfile.ZipFile(out/'kb-sample.docx','w') as z:
            z.writestr('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')
            z.writestr('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')
            z.writestr('word/document.xml','<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>Sample DOCX service offering</w:t></w:r></w:p></w:body></w:document>')
          PY
      - run: node --check backend/server.js
      - name: Validate frontend JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const html=readFileSync('index.html','utf8');
          const script=html.split('<script>')[1]?.split('</script>')[0];
          if(!script)throw Error('Frontend script missing');
          writeFileSync('/tmp/leadflow-frontend.cjs',script);
          execFileSync('node',['--check','/tmp/leadflow-frontend.cjs'],{stdio:'inherit'});
          NODE
      - run: node --test worker/test/*.test.mjs backend/test/*.test.mjs
      - name: Verify real PostgreSQL knowledge lifecycle
        env:
          DATABASE_URL: postgresql://kb_test:kb_test_password@127.0.0.1:5432/kb_test
          KNOWLEDGE_BASE_ENABLED: 'true'
        run: node --test --test-concurrency=1 backend/integration/knowledge-postgres.mjs backend/integration/intelligence-automation-postgres.mjs
      - name: Verify cross-device lead history and save transitions in PostgreSQL
        env:
          DATABASE_URL: postgresql://kb_test:kb_test_password@127.0.0.1:5432/kb_test
        run: node tests/lead-library.integration.mjs
      - name: Verify pizza OSM importer with isolated synthetic nodes and ways
        run: |
          python3 -m pip install --quiet osmium==4.3.2
          python3 scripts/test_regional_import.py
      - name: Validate expanded Maryland coverage
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('backend/data/maryland-businesses.json','utf8'));
          const rows=data.records||[];
          const counts={};
          for(const row of rows)for(const niche of row.niches||[])counts[niche]=(counts[niche]||0)+1;
          console.log(JSON.stringify({total:rows.length,counts}));
          if(rows.length<100)throw Error('Expanded Maryland snapshot has insufficient records');
          for(const niche of ['Financial advisors','Real estate agents','Dental practices','Wellness clinics','Insurance agencies']){
            if((counts[niche]||0)<10)throw Error('Missing expected Maryland niche coverage: '+niche);
          }
          NODE
      - name: Live company website enrichment smoke test (external dependency)
        continue-on-error: true
        run: |
          PORT=10000 API_TOKEN=ci-live-check node backend/server.js > /tmp/leadflow-enrichment.log 2>&1 &
          echo $! > /tmp/leadflow-enrichment.pid
          sleep 3
          node --input-type=module <<'NODE'
          const sites=['https://www.mozilla.org','https://www.python.org','https://www.apache.org'];
          let reachable=0;
          for(const website of sites){
            try{
              const response=await fetch('http://127.0.0.1:10000/enrich',{
                method:'POST',
                headers:{'content-type':'application/json','x-leadflow-token':'ci-live-check'},
                body:JSON.stringify({website}),
                signal:AbortSignal.timeout(90000)
              });
              const data=await response.json();
              const summary={website,status:response.status,pages:data.sources?.length||0,people:data.people?.length||0,phones:data.phones?.length||0,emails:data.emails?.length||0,error:data.error||null};
              console.log(JSON.stringify(summary));
              if(response.ok&&summary.pages>0){
                reachable++;
                for(const person of data.people||[])if(!person.source||!person.name||!person.role)throw Error('Leadership without evidence');
              }
            }catch(error){console.error(website,error.message)}
          }
          if(!reachable)throw Error('No live company website could be enriched; inspect network/robots diagnostics');
          NODE
          kill $(cat /tmp/leadflow-enrichment.pid) || true
      - name: Verify real Wikidata leadership with strict official-site matching
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import {wikidataLeadership} from './backend/wikidata-leadership.js';
          const cases=['https://www.google.com','https://www.microsoft.com','https://www.apple.com'];
          let verified=0;
          for(const website of cases){
            try{
              const people=await wikidataLeadership(website);
              console.log(JSON.stringify({website,matchedLeaders:people.map(p=>({name:p.name,role:p.role,source:p.source,matchedWebsite:p.matchedWebsite}))}));
              for(const person of people){
                if(!person.source?.startsWith('https://www.wikidata.org/entity/')||!person.matchedWebsite)throw Error('Unattributed Wikidata person');
              }
              verified+=people.length;
            }catch(error){console.error('Wikidata lookup failed for '+website+': '+error.message)}
          }
          if(!verified)throw Error('No public company leadership records verified: investigate Wikidata endpoint, official URL equality, and dataset coverage');
          NODE
      - name: Check deployed API health from GitHub runner
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const url='https://leadflow-research-api.onrender.com/health';
          const response=await fetch(url,{signal:AbortSignal.timeout(45000)});
          const body=await response.json();
          console.log(JSON.stringify({status:response.status,health:body.status,indexedBusinesses:body.indexedBusinesses,sharedIntelligence:body.sharedIntelligence,knowledgeBase:body.knowledgeBase,onlineCatalogStorage:body.onlineCatalog?.storage,catalogRecords:body.onlineCatalog?.count}));
          if(body.knowledgeBase?.enabled===true&&body.knowledgeBase?.storageReady!==true)throw Error('Live knowledge storage not ready');
          if(body.sharedIntelligence?.configured!==true)console.warn('SHARED INTELLIGENCE NOT CONFIGURED: feedback writes cannot authenticate');
          if(body.sharedIntelligence?.persistentCatalog!==true)console.warn('CATALOG NOT DURABLE: feedback may be lost after restart');
          if(!response.ok||body.status!=='ok'||body.indexedBusinesses<100)throw Error('Deployed API health check failed');
          NODE
      - name: Verify local Maryland search end-to-end
        run: |
          PORT=18080 node backend/server.js > /tmp/leadflow-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/leadflow-server.log' EXIT
          node --input-type=module <<'NODE'
          const base='http://127.0.0.1:18080';
          for(let i=0;i<30;i++){try{const r=await fetch(base+'/health');if(r.ok)break}catch{}await new Promise(r=>setTimeout(r,500))}
          const health=await (await fetch(base+'/health')).json();
          if(health.indexedBusinesses<10)throw Error('Business snapshot missing: '+JSON.stringify(health));
          for(const [area,minimum] of [['21015',6],['Bel Air, Maryland',10],['Bel Air, Maryland 21015',6]]){
            const response=await fetch(base+'/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({area,niche:'Financial advisors'}),signal:AbortSignal.timeout(8000)});
            const data=await response.json();
            console.log(JSON.stringify({area,status:response.status,count:data.elements?.length||0,source:data.source}));
            if(!response.ok||!data.indexed||data.elements?.length<minimum)throw Error('Indexed business search failed for '+area);
            if(data.elements.some(e=>!e.tags?.name||!Array.isArray(e.sourceAgreement)||!e.sourceAgreement.length))throw Error('Missing business provenance');
            const withWebsites=data.elements.filter(e=>e.tags?.website).length;
            console.log(JSON.stringify({area,withWebsites,withoutWebsites:data.elements.length-withWebsites}));
          }
          NODE
      - name: Live API discovery test (non-blocking external dependency)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const base='https://leadflow-research-api.onrender.com';
          const cases=['21015','Bel Air, Maryland','Maryland','Bel Air, Maryland 21015'];
          for(const area of cases){
            const start=Date.now();
            try{
              const response=await fetch(base+'/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({area,niche:'Financial advisors'}),signal:AbortSignal.timeout(95000)});
              const data=await response.json();
              const count=data.elements?.length||0;
              console.log(JSON.stringify({area,status:response.status,count,elapsedMs:Date.now()-start,source:data.source,error:data.error}));
              if(!response.ok||count===0)process.exitCode=1;
            }catch(e){console.error(area,e.message);process.exitCode=1}
          }
          NODE
