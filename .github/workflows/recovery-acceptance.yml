name: Verify isolated LeadFlow recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 0'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.LEADFLOW_RECOVERY_DATABASE_URL }}
      RECOVERY_DRILL_CONFIRMED: 'yes'
      INTELLIGENCE_ENGINE_ENABLED: 'false'
      KNOWLEDGE_BASE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require isolated recovery connection
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::Set LEADFLOW_RECOVERY_DATABASE_URL to the restored branch connection string, never the production branch.'
            exit 1
          fi
          node -e "const u=new URL(process.env.DATABASE_URL); if(u.hostname!=='ep-summer-sun-b8z5lyht-pooler.c-14.us-east-1.aws.neon.tech')throw Error('Recovery target must be the exact isolated restored branch'); console.log('Recovery database host validated')"
      - run: npm ci --omit=dev
      - name: Boot real LeadFlow backend against restored branch and verify
        run: node tests/recovery-app-smoke.mjs
      - name: Publish recovery acceptance evidence
        if: success()
        shell: bash
        run: |
          printf 'Recovery acceptance passed; event=%s; run_id=%s; commit=%s; restored_branch=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" 'br-calm-dust-b8bwj6zk' | tee recovery-acceptance.txt
          cat recovery-acceptance.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recovery-acceptance-evidence
          path: recovery-acceptance.txt
          retention-days: 14
